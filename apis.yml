aid: jackpocket
name: Jackpocket
description: 'Jackpocket is a third-party lottery courier and mobile app that lets users in
  supported US states order official state lottery tickets — Powerball, Mega Millions, and
  regional draw games — from their phone, with the physical tickets stored securely on their
  behalf and winnings paid out through the app. Founded in 2013 in New York City by Peter
  Sullivan, the company was acquired by DraftKings in 2024. Jackpocket is a consumer-facing
  gaming/lottery brand; it does not currently publish a public developer API, developer portal,
  SDKs, or webhook surface. This API Evangelist profile tracks the company as a network entity
  with its public web properties and domain-security posture.'
